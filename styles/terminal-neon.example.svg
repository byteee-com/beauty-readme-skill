<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">mytool：在终端里一条命令完成项目初始化</title>
  <desc id="desc">示例 hero（霓虹终端风格）。左侧为项目名与定位，右侧为终端窗口，显示示例命令及输出。所有文字均为占位示例。</desc>
  <style>
    :root { --bg:#0B0F14; --surface:#121821; --border:#1F2A37; --fg:#E6EDF3; --muted:#8B98A9; --accent:#3DF2A3; --accent2:#7CC7FF; }
    .bg { fill: var(--bg); }
    .surface { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .title { fill: var(--fg); font-size: 88px; font-weight: 700; letter-spacing: -2px; }
    .sub { fill: var(--muted); font-size: 30px; }
    .code { font-size: 26px; fill: var(--fg); }
    .muted { fill: var(--muted); }
    .accent { fill: var(--accent); }
    .accent2 { fill: var(--accent2); }
    .dot { fill: #2A3644; }
    .cursor { fill: var(--accent); animation: blink 1.06s steps(1) infinite; }
    .line { opacity: 0; animation: reveal 240ms ease-out forwards; }
    .l2 { animation-delay: 500ms; } .l3 { animation-delay: 800ms; } .l4 { animation-delay: 1100ms; } .l5 { animation-delay: 1400ms; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes reveal { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .line { animation: none; opacity: 1; } }
  </style>

  <rect class="bg" width="1280" height="640"/>
  <!-- 扫描线母题，≤4% 不透明度 -->
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#FFFFFF" opacity="0.03"/></pattern>
  <rect width="1280" height="640" fill="url(#scan)"/>

  <!-- 左侧：身份 -->
  <g class="mono">
    <text x="64" y="232" class="accent" font-size="30">❯</text>
    <text x="64" y="320" class="title">mytool</text>
    <text x="64" y="376" class="sub">一条命令初始化项目，</text>
    <text x="64" y="416" class="sub">零配置开始写代码。</text>
    <text x="64" y="520" class="muted" font-size="20">v1.0.0 · MIT · macOS / Linux / Windows</text>
  </g>

  <!-- 右侧：终端窗口 -->
  <g transform="translate(560 120)">
    <rect class="surface" width="656" height="400" rx="12"/>
    <rect x="0" y="0" width="656" height="48" rx="12" fill="#0F141C"/>
    <rect x="0" y="36" width="656" height="12" fill="#0F141C"/>
    <line x1="0" y1="48" x2="656" y2="48" stroke="#1F2A37" stroke-width="1.5"/>
    <circle class="dot" cx="28" cy="24" r="6"/><circle class="dot" cx="48" cy="24" r="6"/><circle class="dot" cx="68" cy="24" r="6"/>
    <text x="328" y="31" text-anchor="middle" class="mono muted" font-size="18">~/projects — mytool</text>

    <g class="mono code">
      <text x="32" y="112" class="line"><tspan class="accent">❯</tspan> npx mytool init my-app</text>
      <text x="32" y="168" class="line l2"><tspan class="accent">✓</tspan> <tspan class="muted">created</tspan> <tspan class="accent2">my-app/</tspan></text>
      <text x="32" y="212" class="line l3"><tspan class="accent">✓</tspan> <tspan class="muted">installed dependencies</tspan></text>
      <text x="32" y="256" class="line l4"><tspan class="accent">✓</tspan> <tspan class="muted">ready in</tspan> <tspan class="accent2">my-app</tspan></text>
      <text x="32" y="320" class="line l5"><tspan class="accent">❯</tspan> cd my-app</text>
      <rect class="cursor" x="220" y="298" width="14" height="28"/>
    </g>
  </g>
</svg>
