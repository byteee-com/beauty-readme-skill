<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Loomtype：把编织图案变成可变字体</title>
  <desc id="desc">示例 hero（孔版印刷风格，overprint-letter 变体）。右半部分是蓝色经线与粉色纬线交织的编织图案，两墨叠印处产生第三色并撞出画布右缘；左侧是蓝墨标题，粉墨描边错位 6px；左下为网点圆形与色版标记。所有内容均为占位示例。</desc>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.6" class="ink2"/>
    </pattern>
    <clipPath id="swatch"><circle cx="1010" cy="380" r="400"/></clipPath>
  </defs>
  <style>
    :root { --paper:#F7F3EA; --ink1:#0078BF; --ink2:#FF48B0; --fg:#1E1E3A; --blend:multiply; }
    @media (prefers-color-scheme: dark) {
      :root { --paper:#17161C; --ink1:#4DB5FF; --ink2:#FF6FC4; --fg:#F7F3EA; --blend:screen; }
    }
    .paper { fill: var(--paper); }
    .ink1 { fill: var(--ink1); }
    .ink2 { fill: var(--ink2); }
    .over { mix-blend-mode: var(--blend); }
    .serif { font-family: "Iowan Old Style", Georgia, "Songti SC", serif; }
    .sans { font-family: -apple-system, "Segoe UI", "Noto Sans", "PingFang SC", sans-serif; }
    .title { font-size: 132px; font-weight: 700; letter-spacing: -3px; }
    .t1 { fill: var(--ink1); }
    .t2 { fill: none; stroke: var(--ink2); stroke-width: 3; }
    .sub { fill: var(--fg); font-size: 34px; }
    .plate { fill: var(--fg); font-size: 22px; letter-spacing: 3px; font-weight: 700; }
    .crop { stroke: var(--fg); stroke-width: 2; }
  </style>

  <rect class="paper" width="1280" height="720"/>

  <!-- 网点圆：粉墨 -->
  <circle cx="230" cy="600" r="116" fill="url(#dots)" class="over"/>

  <!-- 编织：经线（蓝墨）与纬线（粉墨）叠印，裁成圆形织片并旋转 -->
  <g clip-path="url(#swatch)">
    <g transform="rotate(-12 1020 360)">
      <g class="over ink1">
        <rect x="560" y="-100" width="30" height="920"/>
        <rect x="620" y="-100" width="30" height="920"/>
        <rect x="680" y="-100" width="30" height="920"/>
        <rect x="740" y="-100" width="30" height="920"/>
        <rect x="800" y="-100" width="30" height="920"/>
        <rect x="860" y="-100" width="30" height="920"/>
        <rect x="920" y="-100" width="30" height="920"/>
        <rect x="980" y="-100" width="30" height="920"/>
        <rect x="1040" y="-100" width="30" height="920"/>
        <rect x="1100" y="-100" width="30" height="920"/>
        <rect x="1160" y="-100" width="30" height="920"/>
        <rect x="1220" y="-100" width="30" height="920"/>
        <rect x="1280" y="-100" width="30" height="920"/>
        <rect x="1340" y="-100" width="30" height="920"/>
        <rect x="1400" y="-100" width="30" height="920"/>
        <rect x="1460" y="-100" width="30" height="920"/>
      </g>
      <g class="over ink2" transform="translate(5 3)">
        <rect x="560" y="-80" width="940" height="30"/>
        <rect x="560" y="-20" width="940" height="30"/>
        <rect x="560" y="40" width="940" height="30"/>
        <rect x="560" y="100" width="940" height="30"/>
        <rect x="560" y="160" width="940" height="30"/>
        <rect x="560" y="220" width="940" height="30"/>
        <rect x="560" y="280" width="940" height="30"/>
        <rect x="560" y="340" width="940" height="30"/>
        <rect x="560" y="400" width="940" height="30"/>
        <rect x="560" y="460" width="940" height="30"/>
        <rect x="560" y="520" width="940" height="30"/>
        <rect x="560" y="580" width="940" height="30"/>
        <rect x="560" y="640" width="940" height="30"/>
        <rect x="560" y="700" width="940" height="30"/>
        <rect x="560" y="760" width="940" height="30"/>
      </g>
    </g>
  </g>

  <!-- 标题：蓝墨实底 + 粉墨描边错位 -->
  <g class="serif title">
    <text x="70" y="250" class="t2 over">Loom</text>
    <text x="70" y="384" class="t2 over">type</text>
    <text x="64" y="246" class="t1 over">Loom</text>
    <text x="64" y="380" class="t1 over">type</text>
  </g>
  <text x="64" y="452" class="sans sub">把编织图案变成可变字体。</text>

  <!-- 色版标记与裁切线 -->
  <g class="sans">
    <rect x="384" y="586" width="22" height="22" class="ink1"/>
    <text x="418" y="605" class="plate">BLUE</text>
    <rect x="384" y="626" width="22" height="22" class="ink2"/>
    <text x="418" y="645" class="plate">PINK</text>
  </g>
  <g class="crop">
    <line x1="24" y1="40" x2="48" y2="40"/><line x1="40" y1="24" x2="40" y2="48"/>
    <line x1="24" y1="680" x2="48" y2="680"/><line x1="40" y1="672" x2="40" y2="696"/>
  </g>
</svg>
