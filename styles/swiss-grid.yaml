# 风格卡：文档型 · 瑞士网格
id: swiss-grid
name: 瑞士网格
skeleton: document            # 对应 skeletons/document.md
example: swiss-grid.example.svg
summary: 克制、靠网格与字重建立层级；信息密度高，像一份排版精良的规格书。

fit:
  strong: [library, framework, infra, sdk]
  ok: [cli, devtool, research]
  avoid: [game, consumer-app]
  needs: []
signals:
  - keyword: [library, framework, sdk, api, protocol, spec, runtime, engine, database, compiler]
  - file: [src/index.ts, src/lib.rs, lib/, pkg/, docs/, api-extractor.json, typedoc.json]
  - dependency: []
  - meta: [has_docs_site, has_api_reference, many_contributors]

default_weight: L1            # 字标式 hero；架构复杂时 L2 加一张架构图
allows_raster: false
allows_gif: false

tokens:
  light:                      # 主版本：浅色
    bg: "#FFFFFF"
    fg: "#111111"             # 对比度 ≈ 18.9:1
    muted: "#5C5C5C"          # ≈ 6.7:1
    rule: "#111111"           # 网格线、分隔线
    accent: "{brand|#E4002B}" # 单一强调色，只用在 1–2 处
  dark:
    bg: "#0D0D0D"
    fg: "#F2F2F2"
    muted: "#A3A3A3"
    rule: "#F2F2F2"
    accent: "{brand_lightened|#FF4D5E}"
  type:
    display: 新怪诞无衬线（Neue Haas Grotesk / Helvetica Now / Space Grotesk / 思源黑体 Heavy），转路径
    body: "-apple-system, 'Segoe UI', 'Noto Sans', 'PingFang SC', sans-serif"
    scale: { title: 168, subtitle: 32, label: 22, index: 22 }   # 1280 画布；≥22 才能在 GitHub 上 ≥14px
    rules:
      - 标题字距收紧（-2% 到 -4%）
      - 小标签全大写 + 字距放宽（+8%）
  shape:
    radius: 0                 # 无圆角
    stroke: 2
    grid: "12 列；外边距 64；列间距 24"

composition:
  hero:
    canvas: "1280x480"
    layout: 大号项目名左对齐占据上 60%；下方一条粗分隔线，分隔线下按网格排 3–4 个元数据栏（类型 / 语言 / 许可证 / 版本）
    motif: 网格编号（01, 02…）、对齐标尺、单一强调色色块（≤ 8% 面积）
    content_rule: 元数据栏只写可从仓库读取的真实值
  section_header: 不做图；用原生 "##" 标题 + 横线 "---"
  diagram: 架构图用直角线、等宽方框、编号标注；颜色只用 fg + accent

tension:                      # 至少采用 2 条；克制 ≠ 平均
  - 极端尺度：项目名字高 ≥ 画布高的 35%，与 22px 标签形成 ≥ 8:1 的字号比
  - 出血：标题或粗分隔线允许撞出画布一侧（被裁切），打破"四边都留白"的安全感
  - 偏心：主体重心落在左 1/3 或下 1/3，大面积空白留给另一侧
  - 单点强调：强调色只出现在一个"证据"元素上（如一枚印章、一个 SHA），面积 ≤ 8%
  - 网格可见：至少一处把网格线/标尺画出来，让读者看到秩序本身

motion:
  default: false
  allowed: []                 # 该风格不使用动效

forbid:
  - 渐变、阴影、圆角、玻璃拟态
  - 超过一种强调色
  - 居中对称的海报式布局（应左对齐、非对称）
  - 装饰性插画或图标
  - 元数据栏填入虚构数字
